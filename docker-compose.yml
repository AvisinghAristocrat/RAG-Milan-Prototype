services:
  db:
    build:
      context: ./postgres-pgvector
      dockerfile: Dockerfile
    image: local/postgres-pgvector:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: milan_rag
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d milan_rag || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
